<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enyo ESM</title>
<!--
	Enyo's stylesheet is linked by hand. The 2.5 runtime loader injected
	stylesheets with document.write, which modern Chrome discards; there is no
	loader here at all, so the page links what it needs.
-->
<link rel="stylesheet" href="../css/enyo.css">
<style>
	body { font: 14px/1.4 system-ui, sans-serif; margin: 2rem; }
	.panel { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; max-width: 30rem; }
	.hit { background: #e8f0fe; cursor: pointer; padding: .5rem; border-radius: 4px; }
	#log { white-space: pre-wrap; font-family: ui-monospace, monospace; color: #444; }
</style>
</head>
<body>

<h1>Enyo 2.7.0 as native ES modules</h1>
<p>No bundler, no build step &mdash; the modules below are imported straight from
<code>../src/</code> by the browser.</p>

<script>
// A classic script, deliberately not a module: it runs even when the module
// script below never does. A missing export or an unresolvable specifier is a
// LINK-time error, and the module script is then not executed at all -- no
// check runs, no result object appears, and the title stays unchanged. That
// failure was previously invisible here; the page just looked unfinished.
(function () {
	var settled = false;
	function fail (why) {
		if (settled) return;
		settled = true;
		document.title = 'FAIL (load)';
		window.enyoEsmTest = {results: ['FAIL  ' + why], failed: 1};
		var log = document.getElementById('log');
		if (log) log.textContent = 'FAIL  ' + why;
		console.error('HARNESS FAILED: ' + why);
	}
	window.__harnessSettled = function () { settled = true; };
	// a module that fails to link surfaces here
	window.addEventListener('error', function (e) {
		fail('module graph failed to load — ' + ((e && e.message) || 'error'));
	}, true);
	// and if it fails some other way, it still must not look like a pass
	setTimeout(function () { fail('harness did not finish'); }, 15000);
})();
</script>

<div id="app"></div>
<div id="app2"></div>

<h2>Checks</h2>
<div id="log"></div>

<script type="module">
// Imported straight from source. Every specifier carries its .js extension,
// which is what the browser's module resolver requires.
import kind     from '../src/kind.js';
import Control  from '../src/Control/Control.js';
import ready    from '../src/ready.js';
import utils    from '../src/utils.js';
import enyo     from '../index.js';

// The modules whose exports object was rebuilt by hand during the conversion.
import dom           from '../src/dom.js';
import logger        from '../src/logger.js';
import platform      from '../src/platform.js';
import job           from '../src/job.js';
import macroize      from '../src/macroize.js';
import animation     from '../src/animation.js';
import i18n          from '../src/i18n.js';
import roots         from '../src/roots.js';
import dev           from '../src/dev.js';
import cookie        from '../src/cookie.js';
import gesture       from '../src/gesture/gesture.js';
import Binding       from '../src/Binding.js';
import Collection    from '../src/Collection.js';
import Application   from '../src/Application.js';
import PriorityQueue, { Priorities } from '../src/PriorityQueue.js';
import LocalStorageSource from '../src/LocalStorageSource.js';
import Blob          from '../src/Blob.js';
import Popup         from '../src/Popup/Popup.js';
import CoreObject    from '../src/CoreObject.js';
import FormData      from '../src/FormData.js';

var results = [];
function check (name, pass, detail) {
	results.push((pass ? 'PASS  ' : 'FAIL  ') + name + (detail ? '  — ' + detail : ''));
	document.getElementById('log').textContent = results.join('\n');
	if (!pass) { console.error('FAIL: ' + name + (detail ? ' — ' + detail : '')); }
}

check('enyo version is 2.7.0', enyo.version === '2.7.0', 'got ' + enyo.version);

// Every module below had its exports object rebuilt by hand. These check that
// the properties are still hanging off the right thing.
check('kind is callable and carries its statics',
	typeof kind === 'function' && typeof kind.singleton === 'function' &&
	typeof kind.constructorForKind === 'function' && Array.isArray(kind.concatenated));
check('utils namespace intact',
	typeof utils.mixin === 'function' && typeof utils.getPath === 'function' &&
	typeof utils.perfNow === 'function' && utils.where === utils.find);
check('job is callable and carries .stop/.throttle',
	typeof job === 'function' && typeof job.stop === 'function' &&
	typeof job.throttle === 'function');
check('macroize is callable and expands',
	typeof macroize === 'function' && macroize.pattern instanceof RegExp &&
	macroize('hi {$who}', {who: 'there'}) === 'hi there' &&
	typeof macroize.quickReplace === 'function');
check('logger namespace intact',
	typeof logger.log === 'function' && typeof logger.setLogLevel === 'function' &&
	typeof logger.warn === 'function' && typeof logger.level === 'number');
check('platform namespace intact',
	typeof platform === 'object' && 'touch' in platform && 'gesture' in platform);
check('dom namespace intact',
	typeof dom.getComputedStyle === 'function' && typeof dom.addClass === 'function');
check('animation namespace intact',
	typeof animation.requestAnimationFrame === 'function' &&
	typeof animation.easing === 'object' && typeof animation.easedLerp === 'function');
check('roots namespace intact (array renamed internally)',
	Array.isArray(roots.roots) && typeof roots.rendered === 'function' &&
	typeof roots.addToRoots === 'function');
check('i18n namespace intact',
	typeof i18n.$L === 'function' && typeof i18n.updateLocale === 'function');
check('cookie namespace intact',
	typeof cookie.getCookie === 'function' && typeof cookie.setCookie === 'function');
check('dev namespace intact',
	typeof dev === 'object' && typeof dev.Benchmark === 'function');
check('gesture namespace intact',
	typeof gesture.down === 'function' && typeof gesture.events === 'object' &&
	typeof gesture.events.mousedown === 'function');
check('Binding is a kind with its statics',
	typeof Binding === 'function' && Binding.DIRTY_FROM === 0x01 &&
	Binding.DIRTY_TO === 0x02 && Array.isArray(Binding.bindings) &&
	Binding.defaultBindingKind === Binding && typeof Binding.find === 'function');
check('Collection.concat preserved', typeof Collection.concat === 'function');
check('Application.applications preserved', typeof Application.applications === 'object');
check('PriorityQueue default + named Priorities agree',
	typeof PriorityQueue === 'function' && Priorities &&
	PriorityQueue.Priorities === Priorities && 'SOMETIME' in Priorities);
// A default export can be present and still carry the wrong value --
// `export default kind` instead of `export default kind(...)` is a plausible
// codemod slip, and every `typeof x === 'function'` check passes on it.
// kindName comes from the kind's own definition, so it pins the value.
[['Control', Control, 'enyo.Control'],
 ['Popup', Popup, 'enyo.Popup'],
 ['Collection', Collection, 'enyo.Collection'],
 ['Application', Application, 'enyo.Application'],
 ['CoreObject', CoreObject, 'enyo.Object'],
 ['PriorityQueue', PriorityQueue, 'enyo.PriorityQueue']
].forEach(function (row) {
	check(row[0] + ' default export is the kind itself',
		!!row[1] && !!row[1].prototype && row[1].prototype.kindName === row[2],
		'kindName = ' + (row[1] && row[1].prototype && row[1].prototype.kindName));
});

// `typeof LocalStorageSource !== 'undefined'` would have been vacuous — an
// import binding is always defined if the module resolved at all. In a browser
// the feature test inside the module passes, so it must be a real kind.
check('conditional exports resolved',
	typeof Blob === 'function' && typeof FormData === 'function' &&
	typeof LocalStorageSource === (typeof localStorage !== 'undefined' ? 'function' : 'object'),
	'LocalStorageSource is ' + typeof LocalStorageSource);

// A plain Control, created and rendered.
// A kind with a click/tap handler.
var clicks = 0;

var Clicker = kind({
	name: 'Clicker',
	kind: Control,
	classes: 'hit',
	content: 'Click me',
	handlers: {
		ontap: 'handleTap'
	},
	handleTap: function () {
		clicks++;
		this.set('content', 'Clicked ' + clicks + (clicks === 1 ? ' time' : ' times'));
		this.bubble('onClicked', {count: clicks});
		return true;
	}
});

var Panel = kind({
	name: 'Panel',
	kind: Control,
	classes: 'panel',
	components: [
		{name: 'title', tag: 'h3', content: 'A Control tree'},
		{name: 'body', content: 'This paragraph is an enyo/Control.'},
		{name: 'clicker', kind: Clicker}
	]
});

function report () {
	window.__harnessSettled();
	var failed = results.filter(function (r) { return r.indexOf('FAIL') === 0; });
	document.title = failed.length ? 'FAIL (' + failed.length + ')' : 'ALL PASS';
	window.enyoEsmTest = {results: results, failed: failed.length};
	console.log(failed.length ? 'TESTS FAILED: ' + failed.length : 'ALL TESTS PASSED');
}

ready(function () {
  // Without this, a throw part-way through leaves window.enyoEsmTest undefined
  // and the title unchanged, so an automated reader gets "no result" rather
  // than a failure. Reverting the Scrim fix did exactly that.
  try {
	var panel = new Panel();
	panel.renderInto(document.getElementById('app'));

	check('Control rendered a node', !!panel.hasNode());
	check('child Controls rendered', !!panel.$.title.hasNode() && !!panel.$.body.hasNode());
	check('kind inheritance works', panel.$.clicker instanceof Control);
	check('classes applied', panel.hasNode().className.indexOf('panel') > -1);
	check('content rendered into DOM',
		panel.$.title.hasNode().textContent === 'A Control tree');

	// Drive the handler the same way a user would.
	panel.$.clicker.hasNode().click();

	check('ontap handler fired', clicks === 1, 'clicks=' + clicks);
	check('set() re-rendered content',
		panel.$.clicker.hasNode().textContent === 'Clicked 1 time',
		JSON.stringify(panel.$.clicker.hasNode().textContent));

	// Bindings exercise Binding.js, which had its exports object rebuilt.
	var Bound = kind({
		name: 'Bound',
		kind: Control,
		classes: 'panel',
		published: {label: 'initial'},
		components: [
			{tag: 'h3', content: 'A binding'},
			{name: 'out'}
		],
		bindings: [{from: 'label', to: '$.out.content'}]
	});
	var bound = new Bound();
	bound.renderInto(document.getElementById('app2'));
	check('binding delivered initial value',
		bound.$.out.get('content') === 'initial',
		JSON.stringify(bound.$.out.get('content')));
	bound.set('label', 'updated');
	check('binding propagated an update',
		bound.$.out.hasNode().textContent === 'updated',
		JSON.stringify(bound.$.out.hasNode().textContent));

	// A floating popup with a scrim. This is the path that reaches Scrim#create,
	// which called this.inherited(arguments) and so threw under strict mode until
	// 603e5430 — it killed every autoDismiss/modal popup, and nothing else here
	// touched it.
	var popupError = null, pop = null;
	try {
		pop = new Popup({floating: true, scrim: true, autoDismiss: true, content: 'Popup'});
		pop.show();
		pop.render();
	} catch (e) {
		popupError = e;
	}
	check('floating popup with scrim shows without throwing',
		!popupError, popupError && String(popupError));
	check('popup rendered a node', !!(pop && pop.hasNode()));
	check('scrim was created and rendered',
		!!document.querySelector('.enyo-scrim'),
		'enyo-scrim nodes: ' + document.querySelectorAll('.enyo-scrim').length);
	if (pop) pop.hide();

	// Expose for manual poking in the console.
	window.testApp = panel;

	// --- this.inherited(arguments) -------------------------------------
	// The documented Enyo 2.x super-call idiom. It reads arguments.callee,
	// which is a TypeError under strict mode, so kind.js records the
	// executing method instead. These checks fail without that.
	var trace = [];

	var Base = kind({
		name: 'InhBase',
		kind: CoreObject,
		greet: function (who) { trace.push('Base:' + who); return 'base(' + who + ')'; },
		orphan: function () { return this.inherited(arguments); }
	});
	var Middle = kind({
		name: 'InhMiddle',
		kind: Base,
		greet: function (who) {
			trace.push('Middle:' + who);
			return 'middle[' + this.inherited(arguments) + ']';
		}
	});
	var Leaf = kind({
		name: 'InhLeaf',
		kind: Middle,
		greet: function (who) {
			trace.push('Leaf:' + who);
			return 'leaf[' + this.inherited(arguments) + ']';
		}
	});
	// kind.inherited's second argument replaces the leading arguments passed up
	var Swapper = kind({
		name: 'InhSwapper',
		kind: Leaf,
		greet: function (who) { return this.inherited(arguments, ['swapped']); }
	});

	var leaf = new Leaf();
	var out = leaf.greet('x');
	check('this.inherited() walks a three-deep chain',
		out === 'leaf[middle[base(x)]]', JSON.stringify(out));
	check('each level ran exactly once, deepest last',
		trace.join(',') === 'Leaf:x,Middle:x,Base:x', trace.join(','));

	trace.length = 0;
	var swapped = new Swapper().greet('original');
	check('replacement arguments reach the super',
		swapped === 'leaf[middle[base(swapped)]]' && trace.join(',') === 'Leaf:swapped,Middle:swapped,Base:swapped',
		JSON.stringify(swapped) + ' / ' + trace.join(','));

	// a method that does NOT use the idiom must be left completely alone
	check('methods not using the idiom are not wrapped',
		!Base.prototype.greet._inheritedWrapped &&
		!!Middle.prototype.greet._inheritedWrapped,
		'Base.greet wrapped=' + !!Base.prototype.greet._inheritedWrapped +
		' Middle.greet wrapped=' + !!Middle.prototype.greet._inheritedWrapped);

	// Calling up from a method with no super warns rather than throwing. This
	// deliberately logs one warning to the console -- it is expected.
	var orphanThrew = null, orphanResult;
	try { orphanResult = new Base().orphan(); }
	catch (e) { orphanThrew = String(e); }
	check('missing super warns instead of throwing',
		!orphanThrew && orphanResult === undefined, orphanThrew || 'returned ' + orphanResult);

	check('harness ran to completion', true);
  } catch (e) {
	check('harness ran to completion', false, String(e && e.stack || e));
  }
  report();
});
</script>
</body>
</html>
