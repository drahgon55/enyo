<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Enyo ESM — every module</title>
<style>
 body { font: 13px/1.5 ui-monospace, monospace; margin: 2rem; }
 h1 { font-family: system-ui, sans-serif; }
 .ok { color: #137333; } .bad { color: #c5221f; font-weight: bold; }
 #summary { font: 600 16px/1.5 system-ui, sans-serif; margin: 1rem 0; }
</style>
</head>
<body>
<h1>Every module under <code>src/</code></h1>
<p>Each module is imported on its own, to check that it evaluates without a
bundler. Failures here are usually circular-import TDZ errors or top-level
code that assumes a bundler shim.</p>
<div id="summary">running…</div>
<div id="out"></div>

<script type="module">
import modules from './modules.js';

var out = document.getElementById('out');
var failures = [];

for (const m of modules) {
	let line;
	try {
		const ns = await import(m);
		const hasDefault = Object.prototype.hasOwnProperty.call(ns, 'default');
		line = '<div class="ok">ok    ' + m + (hasDefault ? '' : '   (no default export)') + '</div>';
	} catch (e) {
		failures.push([m, String(e)]);
		line = '<div class="bad">FAIL  ' + m + '   ' + String(e).replace(/</g,'&lt;') + '</div>';
	}
	out.insertAdjacentHTML('beforeend', line);
}

document.getElementById('summary').textContent =
	modules.length + ' modules, ' + failures.length + ' failed';
document.title = failures.length ? 'FAIL (' + failures.length + ')' : 'ALL ' + modules.length + ' OK';
window.enyoEsmModuleTest = {total: modules.length, failures: failures};
console.log(failures.length
	? 'MODULE FAILURES: ' + JSON.stringify(failures, null, 1)
	: 'ALL ' + modules.length + ' MODULES EVALUATED CLEANLY');
</script>
</body>
</html>
